<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Calculate BMI</button>
    </form>

    {% if result %}
        <h2>Your BMI: {{ result }}</h2>
        <h3>Category: {{ category }}</h3>
    {% endif %}
</body>
</html>
